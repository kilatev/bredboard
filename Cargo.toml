[workspace]
members = ["crates/core", "crates/app", "crates/tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bredboard-core = { path = "crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
schemars = { version = "=1.2.2", features = ["derive"] }
proptest = "=1.11.0"
jsonschema = "=0.33.0"
