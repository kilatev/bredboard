<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>Store a little energy: charge / discharge</title><desc>Original MIT-licensed schematic for fixtures/projects/rc-bench.json. Electrical connections, not physical breadboard positions.</desc><rect width="800" height="500" fill="#f2f1dc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:17px;fill:#172e36}.wire{fill:none;stroke:#235b66;stroke-width:3;stroke-linejoin:round}.part{fill:#f2f1dc;stroke:#172e36;stroke-width:3}.note{font-size:15px}</style><text x="28" y="35" font-size="23">Store a little energy: charge / discharge</text><text x="75" y="85">V1 +5 V</text><path class="wire" d="M120 95 v5"/><path class="wire" d="M120 100 v15 m0 40 v15"/><rect class="part" x="110" y="115" width="20" height="40"/><text x="140" y="140">R1 1k ohm</text><path class="wire" d="M120 170 v15 h120"/><text x="230" y="170">NC: charge</text><path class="wire" d="M330 250 L245 190 M330 250 h85 v40 M240 315 h-65 v-110 h-55 v20"/><text x="225" y="344">NO: discharge</text><path class="wire" d="M120 225 v15 m0 40 v15"/><rect class="part" x="110" y="240" width="20" height="40"/><text x="140" y="265">R2 1k ohm</text><path class="wire" d="M120 295 v20"/><path class="wire" d="M120 315 v15 m-18 0 h36 m-29 8 h22 m-16 8 h10"/><text x="325" y="230">S1 common</text><text x="440" y="300">C1 100 uF</text><path class="wire" d="M395 290 h40 M395 306 h40 M415 306 v40"/><text x="380" y="282">+</text><path class="wire" d="M415 346 v15 m-18 0 h36 m-29 8 h22 m-16 8 h10"/><text x="485" y="130">S1 selects a path:</text><text x="485" y="170">NC -> charge through R1</text><text x="485" y="205">NO -> drain through R2</text><text x="28" y="460" class="note">C1 is polarized: positive to S1 common; negative to ground.</text><text x="28" y="487" class="note">5 V DC only. Disconnect physical power before changing wires.</text></svg>