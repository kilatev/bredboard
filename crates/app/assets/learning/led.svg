<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>First light: resistor + LED + button</title><desc>Original MIT-licensed schematic for fixtures/projects/led-bench.json. Electrical connections, not physical breadboard positions.</desc><rect width="800" height="500" fill="#f2f1dc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:17px;fill:#172e36}.wire{fill:none;stroke:#235b66;stroke-width:3;stroke-linejoin:round}.part{fill:#f2f1dc;stroke:#172e36;stroke-width:3}.note{font-size:15px}</style><text x="28" y="35" font-size="23">First light: resistor + LED + button</text><text x="185" y="90">V1 +5 V</text><path class="wire" d="M240 100 v20"/><path class="wire" d="M240 120 v15 m0 40 v15"/><rect class="part" x="230" y="135" width="20" height="40"/><text x="260" y="160">R1 330 ohm</text><path class="wire" d="M240 190 v10"/><path class="wire" d="M240 200 v20 m0 30 v20"/><path class="part" d="M228 220 h24 l-12 26 z M226 250 h28"/><path class="wire" d="M260 227 l16 -16 m-10 0 h10 v10 M267 238 l16 -16 m-10 0 h10 v10"/><text x="295" y="243">D1 LED</text><text x="210" y="216">A</text><text x="210" y="265">K</text><path class="wire" d="M240 270 v10"/><path class="wire" d="M240 280 v15 m0 30 v15 M240 295 l18 25"/><text x="268" y="315">B1 button</text><path class="wire" d="M240 340 v10"/><path class="wire" d="M240 350 v15 m-18 0 h36 m-29 8 h22 m-16 8 h10"/><text x="500" y="175">Press B1 to light D1.</text><text x="500" y="215">R1 limits current.</text><text x="500" y="255">A = anode (+)</text><text x="500" y="285">K = cathode (-)</text><text x="28" y="460" class="note">A schematic shows connections. The ready board shows actual holes.</text><text x="28" y="487" class="note">5 V DC only. Disconnect physical power before changing wires.</text></svg>