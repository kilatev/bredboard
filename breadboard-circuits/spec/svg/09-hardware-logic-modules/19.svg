-anchor="middle"><tspan x="468.0" dy="11">555</tspan><tspan x="468.0" dy="11">развёртка</tspan></text><text x="468.0" y="127.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="468.0" dy="11">2× 74HC85 + логика</tspan><tspan x="468.0" dy="11">отбит / пропущен</tspan></text><text x="468.0" y="253.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="468.0" dy="11">Ракетки: 2 потенц.</tspan><tspan x="468.0" dy="11">→ 2× ADC0804</tspan></text><text x="702.0" y="127.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="702.0" dy="11">Счёт: 2× 74HC390</tspan><tspan x="702.0" dy="11">+ CD4511 + индикаторы</tspan></text><text x="363.59999999999997" y="338.40000000000003" dominant-baseline="central" fill="black" font-size="12" font-family="sans" text-anchor="middle"><tspan x="363.59999999999997" dy="12">Ориентировочно 20 микросхем. «Отбит» разворачивает</tspan><tspan x="363.59999999999997" dy="12">направление мяча, «пропущен» добавляет очко.</tspan></text><text x="363.59999999999997" y="374.40000000000003" dominant-baseline="central" fill="black" font-size="12" font-family="sans" text-anchor="middle"><tspan x="363.59999999999997" dy="12">Как в Pong 1972 года: вся игра — счётчики, компараторы и</tspan><tspan x="363.59999999999997" dy="12">развёртка.</tspan></text></svg>